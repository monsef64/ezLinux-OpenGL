name: Build Linux

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (ubuntu-latest, gcc, linux-gcc-debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # Data/Content and Data/Tools/Precompiled are very large and are not needed to build.
        # The ThirdParty submodules are initialized explicitly below.
        with:
          submodules: false

      - name: Initialize ThirdParty submodules
        run: git submodule update --init --depth 1 Code/ThirdParty/assimp Code/ThirdParty/fmod Code/ThirdParty/SPIRV-Cross

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates
        # ubuntu-latest currently ships CMake >= 4 (configure passes -DCMAKE_POLICY_VERSION_MINIMUM=3.5).
        # EGL/GL are loaded at runtime via dlopen (see EGLLoader), so no Mesa dev packages are needed here.

      - name: Configure (linux-gcc-debug)
        # Mirrors the configuration verified to configure and build from scratch.
        # Notes:
        # - CMAKE_POLICY_VERSION_MINIMUM=3.5 is required because ubuntu-latest ships CMake >= 4, which
        #   removed compatibility with cmake_minimum_required < 3.5 (SPIRV-Cross declares 3.1).
        #   Without it, configure fails with: Compatibility with CMake < 3.5 has been removed from CMake.
        # - Vulkan is OFF: the Vulkan RENDERER does not compile on Linux (RendererVulkan has
        #   #error guards there) and now defaults to OFF on Linux. The DXC based shader compiler
        #   toolchain is independent of the renderer; enable it with -DEZ_BUILD_SHADERCOMPILER_DXC=ON.
        # - GLFW is OFF: the X11/GLFW window path is optional; without it the engine falls back to the
        #   NoImpl window, which is all that is needed to compile the engine and tests.
        # - Qt, RMLUI and OpenXR are OFF for the same reason: not required for a plain build.
        run: |
          cmake --preset linux-gcc-debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DEZ_ENABLE_QT_SUPPORT=OFF \
            -DEZ_BUILD_RMLUI=OFF \
            -DEZ_BUILD_OPENXR=OFF \
            -DEZ_BUILD_VULKAN=OFF \
            -DEZ_3RDPARTY_GLFW_SUPPORT=OFF \
            -DEZ_BUILD_OPENGL=ON

      - name: Build
        run: ninja -C Workspace/linux-gcc-debug GameEngine RendererOpenGL RendererTest MeshRenderSample TextureSample ShaderExplorer

      - name: Artifact - Binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-gcc-debug-binaries
          path: Output/Bin/LinuxNinjaGccDebug64
          retention-days: 3

  test-renderer:
    name: RendererTest (ubuntu-24.04, OpenGL via Mesa llvmpipe)
    # Pinned to 24.04: ubuntu-latest has moved to Ubuntu 26 where the Mesa package names
    # changed; 24.04 (noble) ships the documented mesa names used below.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Initialize ThirdParty submodules
        run: git submodule update --init --depth 1 Code/ThirdParty/assimp Code/ThirdParty/fmod Code/ThirdParty/SPIRV-Cross

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Mesa (llvmpipe) provides a software GL 4.5 implementation so the OpenGL renderer
          # can be exercised headless through EGL's surfaceless platform.
          # libegl-mesa0 is the Mesa EGL vendor driver that glvnd dispatches to -
          # libegl1 alone is only the dispatch layer.
          # libvulkan-dev is required by find_package(Vulkan) at configure time.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            libvulkan-dev libxcb1-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libglapi-mesa
        # ubuntu-24.04 ships CMake 3.28; -DCMAKE_POLICY_VERSION_MINIMUM=3.5 is ignored there (harmless),
        # and required on newer images where CMake >= 4 removed < 3.5 compatibility.

      - name: Configure (linux-gcc-debug, DXC toolchain ON)
        # The DXC based shader compiler toolchain is enabled independently of the Vulkan renderer
        # (the renderer does not compile on Linux). Configure downloads the DXC toolchain from a
        # GitHub release asset (reachable from GitHub-hosted runners) on first configure.
        # That builds ShaderCompilerDXC / ShaderCompilerVulkan / ShaderCompilerOpenGL, which
        # RendererTest needs to compile shaders at run time. RendererVulkan is NOT built
        # (EZ_BUILD_VULKAN defaults to OFF on Linux).
        run: |
          cmake --preset linux-gcc-debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DEZ_ENABLE_QT_SUPPORT=OFF \
            -DEZ_BUILD_RMLUI=OFF \
            -DEZ_BUILD_OPENXR=OFF \
            -DEZ_BUILD_VULKAN=OFF \
            -DEZ_BUILD_SHADERCOMPILER_DXC=ON \
            -DEZ_3RDPARTY_GLFW_SUPPORT=OFF \
            -DEZ_BUILD_OPENGL=ON

      - name: Build
        # On failure, surface compiler errors as CI annotations (visible via the Checks API without
        # needing the full job log).
        run: |
          set +e
          ninja -C Workspace/linux-gcc-debug GameEngine RendererOpenGL ShaderCompilerOpenGL RendererTest > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "=== build.log (last 150 lines) ==="
            tail -150 build.log
            echo "=== errors as annotations ==="
            grep -E "FAILED:|error:|fatal error|undefined reference|cannot find|collect2|ld: |ld returned" build.log | head -40 | while read -r line; do
              # strip ninja's FAILED: prefix and file noise a bit
              echo "::error::${line:0:400}"
            done
            exit $code
          fi
          tail -5 build.log

      - name: Probe EGL (Mesa llvmpipe, surfaceless)
        run: |
          EGL_PLATFORM=surfaceless python3 - <<'PYEOF' | tee egl-probe.log || true
          import ctypes
          lib = ctypes.CDLL("libEGL.so.1")
          lib.eglGetDisplay.restype = ctypes.c_void_p
          d = lib.eglGetDisplay(0)  # EGL_DEFAULT_DISPLAY
          print("eglGetDisplay ->", hex(d) if d else "FAILED")
          maj, mnr = ctypes.c_int(), ctypes.c_int()
          ok = lib.eglInitialize(d, ctypes.byref(maj), ctypes.byref(mnr))
          print("eglInitialize ->", ok, "EGL version", maj.value, mnr.value)
          r = lib.eglQueryString(d, 0x308D)  # EGL_CLIENT_APIS
          print("client APIs:", ctypes.cast(r, ctypes.c_char_p).value if r else None)
          r = lib.eglQueryString(d, 0x3053)  # EGL_VENDOR
          print("vendor:", ctypes.cast(r, ctypes.c_char_p).value if r else None)
          PYEOF
          grep . egl-probe.log | while read -r line; do echo "::notice::EGL probe: $line"; done

      - name: Run RendererTest (OpenGL, headless)
        # Informational for now: no OpenGL reference images exist yet (image comparisons need
        # baselines captured on a GL-capable machine), so image-comparison subtests are expected
        # to fail until those are added. The interesting signal is whether the device initializes,
        # shaders compile through SPIR-V -> GLSL (SPIRV-Cross) and how many suites pass.
        # Output images/logs are uploaded as artifacts; key log lines are also emitted as CI
        # annotations (visible via the Checks API without log access).
        continue-on-error: true
        run: |
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          ./Output/Bin/LinuxNinjaGccDebug64/RendererTest -noGui true -headless true -renderer OpenGL -outputDir "$PWD/RendererTestOutput" > renderertest.log 2>&1
          code=$?
          set -e
          echo "RendererTest exit code: $code"
          tail -150 renderertest.log
          echo "=== consolidated diagnostics as two annotations (Checks API caps displayed annotations) ==="
          sed -r 's/\x1b\[[0-9;]*m//g' renderertest.log > renderertest-clean.log
          FAILING=$(grep -E "(Test|Sub-Test) '[^']*' failed" renderertest-clean.log | sed 's/ ([0-9.]* sec)\.//' | cut -c1-160 | tr '\n' '~')
          SUMMARY=$(grep -E "Tests (failed|passed)" renderertest-clean.log | tail -2 | tr '\n' '~')
          echo "::notice::failing: ${FAILING} | ${SUMMARY}"
          HISTO=$(awk '/Executing Test:|Executing Sub-Test:/{cur=$0; next} /ezLog Error|Failure: |Comparison Image|Image Comparison Failed|queryValues|Block:|mismatch/{n[cur" +++ "substr($0,1,150)]++} END{for (k in n) printf "%d %s~", n[k], k}' renderertest-clean.log | sed 's/^ *//' | sort -rn | head -30)
          echo "::notice::per-test-errors: ${HISTO:0:2900}"
          if grep -qE "Tests failed: [1-9]" renderertest.log; then
            echo "::warning::RendererTest reported failing suites. Expected until OpenGL reference images are captured; inspect the RendererTestOutput artifact."
          fi

      - name: Probe - sRGB write/readback behavior (TEMP)
        if: always()
        run: |
          export EGL_PLATFORM=surfaceless
          export LIBGL_ALWAYS_SOFTWARE=1
          python3 - <<'PYEOF'
          import ctypes, sys
          EGL_PLATFORM_SURFACELESS = 0x31DD
          EGL_OPENGL_API = 0x30A2
          EGL_NONE = 0x3038
          EGL_RENDERABLE_TYPE = 0x3040
          EGL_OPENGL_BIT = 0x0008
          EGL_CONTEXT_MAJOR_VERSION = 0x3098
          EGL_CONTEXT_MINOR_VERSION = 0x30FB
          EGL_CONTEXT_OPENGL_PROFILE_MASK = 0x30FD
          EGL_CONTEXT_OPENGL_CORE_PROFILE_BIT = 0x0001
          libegl = ctypes.CDLL('libEGL.so.1')
          libegl.eglGetDisplay.restype = ctypes.c_void_p
          libegl.eglGetProcAddress.restype = ctypes.c_void_p
          libegl.eglGetPlatformDisplay.restype = ctypes.c_void_p
          libegl.eglGetPlatformDisplay.argtypes = [ctypes.c_uint, ctypes.c_void_p, ctypes.c_void_p]
          display = libegl.eglGetPlatformDisplay(EGL_PLATFORM_SURFACELESS, None, None)
          if not display:
              print('::notice::PROBE eglGetPlatformDisplay failed'); sys.exit(0)
          major, minor = ctypes.c_int(), ctypes.c_int()
          ok = libegl.eglInitialize(display, ctypes.byref(major), ctypes.byref(minor))
          print('::notice::PROBE eglInitialize=%d EGL %d.%d' % (ok, major.value, minor.value))
          libegl.eglBindAPI(EGL_OPENGL_API)
          cfg_attribs = (ctypes.c_int * 4)(EGL_RENDERABLE_TYPE, EGL_OPENGL_BIT, EGL_NONE, EGL_NONE)
          num_cfg = ctypes.c_int()
          config = ctypes.c_void_p()
          ok = libegl.eglChooseConfig(display, cfg_attribs, ctypes.byref(config), 1, ctypes.byref(num_cfg))
          print('::notice::PROBE eglChooseConfig ok=%d num=%d' % (ok, num_cfg.value))
          if num_cfg.value == 0:
              print('::notice::PROBE no EGL config'); sys.exit(0)
          ctx_attribs = (ctypes.c_int * 8)(EGL_CONTEXT_MAJOR_VERSION, 4, EGL_CONTEXT_MINOR_VERSION, 5,
                                            EGL_CONTEXT_OPENGL_PROFILE_MASK, EGL_CONTEXT_OPENGL_CORE_PROFILE_BIT,
                                            EGL_NONE, EGL_NONE)
          context = libegl.eglCreateContext(display, config, None, ctx_attribs)
          print('::notice::PROBE eglCreateContext ->', context)
          if not context:
              print('::notice::PROBE eglGetError', hex(libegl.eglGetError())); sys.exit(0)
          ok = libegl.eglMakeCurrent(display, None, None, context)
          print('::notice::PROBE eglMakeCurrent(surfaceless) ok=%d' % ok)
          if not ok:
              print('::notice::PROBE eglGetError', hex(libegl.eglGetError())); sys.exit(0)
          def glfun(name, restype, *argtypes):
              addr = libegl.eglGetProcAddress(name)
              return ctypes.CFUNCTYPE(restype, *argtypes)(addr)
          GL_VERSION = 0x1F02
          glGetString = glfun('glGetString', ctypes.c_char_p, ctypes.c_uint)
          glGetIntegerv = glfun('glGetIntegerv', None, ctypes.c_uint, ctypes.c_void_p)
          glGenTextures = glfun('glGenTextures', None, ctypes.c_int, ctypes.POINTER(ctypes.c_uint))
          glBindTexture = glfun('glBindTexture', None, ctypes.c_uint, ctypes.c_uint)
          glTexImage2D = glfun('glTexImage2D', None, ctypes.c_uint, ctypes.c_int, ctypes.c_int, ctypes.c_uint, ctypes.c_uint, ctypes.c_int, ctypes.c_uint, ctypes.c_uint, ctypes.c_void_p)
          glTexParameteri = glfun('glTexParameteri', None, ctypes.c_uint, ctypes.c_uint, ctypes.c_int)
          glGenFramebuffers = glfun('glGenFramebuffers', None, ctypes.c_int, ctypes.POINTER(ctypes.c_uint))
          glBindFramebuffer = glfun('glBindFramebuffer', None, ctypes.c_uint, ctypes.c_uint)
          glFramebufferTexture2D = glfun('glFramebufferTexture2D', None, ctypes.c_uint, ctypes.c_uint, ctypes.c_uint, ctypes.c_uint, ctypes.c_int)
          glClearColor = glfun('glClearColor', None, ctypes.c_float, ctypes.c_float, ctypes.c_float, ctypes.c_float)
          glClear = glfun('glClear', None, ctypes.c_uint)
          glGetTexImage = glfun('glGetTexImage', None, ctypes.c_uint, ctypes.c_int, ctypes.c_uint, ctypes.c_uint, ctypes.c_void_p)
          glCopyImageSubData = glfun('glCopyImageSubData', None, ctypes.c_uint, ctypes.c_uint, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_uint, ctypes.c_uint, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_int)
          GL_TEXTURE_2D = 0x0DE1
          GL_FRAMEBUFFER = 0x8D40
          GL_COLOR_ATTACHMENT0 = 0x8CE0
          GL_SRGB8_ALPHA8 = 0x8E47
          GL_RGBA8 = 0x8058
          GL_RGBA = 0x1908
          GL_UNSIGNED_BYTE = 0x1401
          GL_COLOR_BUFFER_BIT = 0x4000
          GL_FRAMEBUFFER_SRGB = 0x8DB9
          print('::notice::PROBE GL_VERSION =', glGetString(GL_VERSION).decode())
          fb_srgb = ctypes.c_int32()
          glGetIntegerv(GL_FRAMEBUFFER_SRGB, ctypes.byref(fb_srgb))
          print('::notice::PROBE GL_FRAMEBUFFER_SRGB default =', fb_srgb.value)
          GL_TEXTURE_MIN_FILTER, GL_TEXTURE_MAG_FILTER = 0x2801, 0x2800
          GL_TEXTURE_WRAP_S, GL_TEXTURE_WRAP_T = 0x2802, 0x2803
          GL_NEAREST, GL_CLAMP_TO_EDGE = 0x2600, 0x812F
          def make_tex(fmt):
              t = ctypes.c_uint(0)
              glGenTextures(1, ctypes.byref(t))
              glBindTexture(GL_TEXTURE_2D, t.value)
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST)
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST)
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE)
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE)
              glTexImage2D(GL_TEXTURE_2D, 0, fmt, 8, 8, 0, GL_RGBA, GL_UNSIGNED_BYTE, None)
              glBindTexture(GL_TEXTURE_2D, 0)
              return t.value
          def clear_on_fbo(tex):
              fbo = ctypes.c_uint(0)
              glGenFramebuffers(1, ctypes.byref(fbo))
              glBindFramebuffer(GL_FRAMEBUFFER, fbo.value)
              glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, tex, 0)
              glClearColor(0.5, 0.5, 0.5, 1.0)
              glClear(GL_COLOR_BUFFER_BIT)
              glBindFramebuffer(GL_FRAMEBUFFER, 0)
              return fbo.value
          srgb_tex = make_tex(GL_SRGB8_ALPHA8)
          unorm_tex = make_tex(GL_RGBA8)
          clear_on_fbo(srgb_tex)
          data = (ctypes.c_ubyte * (8*8*4))()
          glBindTexture(GL_TEXTURE_2D, srgb_tex)
          glGetTexImage(GL_TEXTURE_2D, 0, GL_RGBA, GL_UNSIGNED_BYTE, data)
          glBindTexture(GL_TEXTURE_2D, 0)
          print('::notice::PROBE sRGB FBO glClear(0.5) -> glGetTexImage(sRGB) bytes =', list(data[:4]))
          clear_on_fbo(unorm_tex)
          data2 = (ctypes.c_ubyte * (8*8*4))()
          glBindTexture(GL_TEXTURE_2D, unorm_tex)
          glGetTexImage(GL_TEXTURE_2D, 0, GL_RGBA, GL_UNSIGNED_BYTE, data2)
          glBindTexture(GL_TEXTURE_2D, 0)
          print('::notice::PROBE UNORM FBO glClear(0.5) -> glGetTexImage bytes =', list(data2[:4]))
          raw_copy = make_tex(GL_RGBA8)
          glCopyImageSubData(srgb_tex, GL_TEXTURE_2D, 0, 0, 0, 0, raw_copy, GL_TEXTURE_2D, 0, 0, 0, 0, 8, 8, 1)
          data3 = (ctypes.c_ubyte * (8*8*4))()
          glBindTexture(GL_TEXTURE_2D, raw_copy)
          glGetTexImage(GL_TEXTURE_2D, 0, GL_RGBA, GL_UNSIGNED_BYTE, data3)
          glBindTexture(GL_TEXTURE_2D, 0)
          print('::notice::PROBE sRGB stored -> glCopyImageSubData -> UNORM readback bytes =', list(data3[:4]))
          PYEOF

      - name: Forensics - analyze captured images (TEMP)
        if: always()
        run: |
          (python3 -m pip install --quiet pillow numpy 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil python3-numpy)) || true
          python3 - <<'PYEOF'
          import glob, os
          try:
              from PIL import Image
              import numpy as np
          except Exception as e:
              print('::notice::FORENSICS-SKIP deps unavailable: %s' % e)
              raise SystemExit(0)

          RES = 'RendererTestOutput/Images_Result'
          REFDIR = 'Data/UnitTests/RendererTest/Images_Reference'
          TAGS = ['', '-linux', '-opengl', '-llvmpipe', '-opengl-llvmpipe', '-vulkan', '-vulkan-llvmpipe', '-d3dref', '-amd', '-swiftshader']
          rows = []
          n = 0; fy_much_better = 0; raw_much_better = 0; tot_raw = 0.0; tot_fy = 0.0; noref = 0
          for cap in sorted(glob.glob(RES + '/*.png')):
              name = os.path.basename(cap)[:-4]
              ref_path = None; ref_tag = None
              for t in TAGS:
                  p = os.path.join(REFDIR, name + t + '.png')
                  if os.path.exists(p):
                      ref_path = p; ref_tag = t or 'base'; break
              if ref_path is None:
                  noref += 1
                  continue
              a = np.asarray(Image.open(cap).convert('RGBA'), dtype=np.float32)
              b = np.asarray(Image.open(ref_path).convert('RGBA'), dtype=np.float32)
              if a.shape != b.shape:
                  rows.append('%s: SIZE %dx%d vs ref %dx%d (%s)' % (name, a.shape[1], a.shape[0], b.shape[1], b.shape[0], ref_tag))
                  continue
              def mse(x, y):
                  d = x - y
                  return float((d * d).mean())
              raw = mse(a, b)
              fy = mse(np.ascontiguousarray(a[::-1]), b)
              fx = mse(np.ascontiguousarray(a[:, ::-1]), b)
              r180 = mse(np.ascontiguousarray(a[::-1, ::-1]), b)
              d = (a - b).mean(axis=(0, 1))
              rows.append('%s: raw=%.0f flipY=%.0f flipX=%.0f rot180=%.0f d=(%+.1f,%+.1f,%+.1f,%+.1f) ref=%s' % (name, raw, fy, fx, r180, d[0], d[1], d[2], d[3], ref_tag))
              n += 1; tot_raw += raw; tot_fy += fy
              if fy < raw * 0.5: fy_much_better += 1
              if raw < fy * 0.5: raw_much_better += 1
          print('::notice::FORENSICS-SUMMARY files=%d noref=%d avg_raw_mse=%.0f avg_flipy_mse=%.0f flipy_much_better=%d raw_much_better=%d' % (n, noref, tot_raw / max(n, 1), tot_fy / max(n, 1), fy_much_better, raw_much_better))
          print('::notice::FORENSICS ' + '~'.join(rows))
          PYEOF

      - name: Artifact - RendererTest output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderertest-output
          path: |
            RendererTestOutput
            renderertest.log
          retention-days: 7
